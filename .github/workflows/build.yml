# ============================================================================
# Lyrico-Wear 构建工作流
#
# 作用：构建 WearOS 版 Lyrico APK
#   - 基于原 Lyrico 完整代码库（lyrico-app + lyrico-audiotag）
#   - 额外集成 WearOS 内置文件选择器（Shizuku + Wear Material 3）
#   - 用内置文件选择器替代所有系统 DocumentsUI 调用点：
#     · 导入插件（PluginManagerScreen）
#     · 选择音乐文件夹（FolderManagerScreen + SongsPage）
#
# 产出物：
#   - Lyrico-Wear-armeabi-v7a.apk（手表主产物）
#   - Lyrico-Wear-arm64-v8a.apk（64 位设备用）
#   产物保留 30 天
#
# 触发方式：
#   1. push 到 master：改了代码自动构建
#   2. workflow_dispatch：手动在 Actions 页面运行
#
# 查错指引：
#   - 构建失败 + "taglib/quickjs-ng 目录缺失" → 子模块没拉，检查 .gitmodules
#   - 构建失败 + CMake/NDK 错误 → 检查 ndkVersion 与 CMake version 是否匹配
#   - 构建失败 + "插件目录缺失" → Lyrico-Plugins 仓库结构变了
#   - 构建成功但覆盖安装提示签名冲突 → 配置 LYRICO_KEYSTORE_BASE64 secret
# ============================================================================
name: 🏗️ 构建 WearOS APK

on:
  push:
    branches: [master]
    paths:
      - 'lyrico-app/**'
      - 'lyrico-audiotag/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: 'Lyrico-Plugins 仓库的 git ref（分支/tag/commit）'
        required: false
        default: 'main'

concurrency:
  group: build-wear-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 WearOS APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. 检出源码 ──────────────────────────────────────────────────────────
      # 注：不用 actions/checkout 的 submodules: recursive，
      # 因为子模块 gitlink 没有提交到仓库（只是 .gitmodules 配置了 URL）。
      # 改为在下方手动 clone 子模块，更可控。
      - name: 📥 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 1.5 手动 clone 子模块（taglib + quickjs-ng）──────────────────────────
      # 原生 cpp 代码依赖：
      #   - lyrico-audiotag 用 taglib（读写音频元数据）
      #   - lyrico-app 用 quickjs-ng（运行插件 JS）+ ebur128（音量标准化）
      # 如果 clone 失败，构建会在 CMake 阶段报错
      - name: 📦 Clone 子模块（taglib + quickjs-ng）
        shell: bash
        run: |
          set -e
          echo "─── 克隆 taglib ───"
          if [ ! -d "lyrico-audiotag/src/main/cpp/taglib/.git" ]; then
            rm -rf lyrico-audiotag/src/main/cpp/taglib
            git clone --depth 1 https://github.com/taglib/taglib.git lyrico-audiotag/src/main/cpp/taglib
          fi
          echo "─── 克隆 taglib 的嵌套子模块 utfcpp（CMake 构建必需）───"
          # taglib 的 CMakeLists.txt 在 3rdparty/utfcpp 目录找不到时会 FATAL_ERROR
          # 必须初始化 taglib 自己的子模块
          cd lyrico-audiotag/src/main/cpp/taglib
          # 看 taglib 的 .gitmodules 确认子模块路径
          cat .gitmodules 2>/dev/null || echo "(no .gitmodules in taglib)"
          git submodule update --init --recursive --depth 1
          cd -
          echo "─── 克隆 quickjs-ng ───"
          if [ ! -d "lyrico-app/src/main/cpp/quickjs-ng/.git" ]; then
            rm -rf lyrico-app/src/main/cpp/quickjs-ng
            git clone --depth 1 https://github.com/quickjs-ng/quickjs.git lyrico-app/src/main/cpp/quickjs-ng
          fi
          echo "─── 验证子模块 ───"
          ls lyrico-audiotag/src/main/cpp/taglib/CMakeLists.txt
          ls lyrico-audiotag/src/main/cpp/taglib/3rdparty/utfcpp/CMakeLists.txt 2>/dev/null || echo "(utfcpp not at 3rdparty/utfcpp - will rely on find_path)"
          ls lyrico-app/src/main/cpp/quickjs-ng/CMakeLists.txt
          echo "✅ 子模块已就绪"

      # ── 2. 检出 Lyrico-Plugins（每次构建都拉最新版）──────────────────────────
      # 这保证了插件层面的更新（搜索逻辑修复、新平台对接等）无需改本仓库就能自动跟进。
      # 插件会被打包进 APK，App 首次启动时由 BuiltinPluginSeeder 自动安装。
      - name: 📥 检出 Lyrico-Plugins
        uses: actions/checkout@v4
        with:
          repository: Replica0110/Lyrico-Plugins
          ref: ${{ inputs.plugin_ref || 'main' }}
          path: Lyrico-Plugins
          fetch-depth: 1

      # ── 3. 设置时区（日志时间戳为北京时间，方便查错）──────────────────────────
      - name: 🌏 设置时区
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Shanghai"

      # ── 4. 把插件复制到 assets/builtin_plugins/ ──────────────────────────────
      # 这样插件会被打包进 APK，App 首次启动时由 BuiltinPluginSeeder 自动安装。
      # 如果某个插件目录缺失，构建会立即失败（fail fast）。
      - name: 🧩 暂存内置插件到 assets
        shell: bash
        run: |
          set -e
          ASSET_DIR="lyrico-app/src/main/assets/builtin_plugins"
          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"
          for p in netease qq kugou soda apple; do
            src="Lyrico-Plugins/$p"
            if [ ! -d "$src" ]; then
              echo "::error::插件目录缺失: $src"
              echo "::error::请检查 Lyrico-Plugins 仓库结构是否变化"
              exit 1
            fi
            cp -r "$src" "$ASSET_DIR/$p"
          done
          echo "─── 已暂存内置插件 ───"
          ls -1 "$ASSET_DIR"

      # ── 5. 设置 JDK 21（AGP 9.x 需要 JDK 21+）─────────────────────────────────
      - name: ☕ 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # ── 6. 设置 Android NDK（原生 cpp 代码需要）────────────────────────────────
      # lyrico-audiotag 用 taglib，lyrico-app 用 quickjs-ng + ebur128
      # NDK 版本必须与 build.gradle.kts 中的 ndkVersion 一致
      - name: 🔧 设置 Android NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r29
          add-to-path: false
          local-cache: true

      - name: 📝 写入 NDK 路径到 gradle.properties
        run: |
          # 确保 gradle.properties 末尾有换行符，避免追加时和上一行粘连
          # （之前因末尾无换行导致 android.nonTransitiveRClass=true 和 android.ndk.path=... 粘在一起）
          [ -n "$(tail -c1 gradle.properties)" ] && echo "" >> gradle.properties
          echo "android.ndk.path=${{ steps.setup_ndk.outputs.ndk-path }}" >> gradle.properties
          echo "─── gradle.properties 末尾 ───"
          tail -5 gradle.properties

      # ── 7. 赋予 gradlew 执行权限 ─────────────────────────────────────────────
      - name: 🔐 赋予 gradlew 执行权限
        run: chmod +x gradlew

      # ── 8. 配置 Gradle（缓存加速）────────────────────────────────────────────
      - name: 🐘 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── 8.5 解码固定签名 keystore ────────────────────────────────────────────
      # 用固定 keystore 签名，保证每次 CI 构建的 APK 签名一致，
      # 覆盖安装时不会因签名冲突而要求卸载（避免数据丢失）。
      - name: 🔑 解码签名 keystore
        env:
          LYRICO_KEYSTORE_BASE64: ${{ secrets.LYRICO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LYRICO_KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 LYRICO_KEYSTORE_BASE64 secret，使用默认 debug 签名（覆盖安装可能失败）"
            exit 0
          fi
          echo "$LYRICO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lyrico-debug.keystore"
          echo "LYRICO_KEYSTORE_PATH=$RUNNER_TEMP/lyrico-debug.keystore" >> "$GITHUB_ENV"
          echo "LYRICO_KEYSTORE_PASSWORD=lyrico-debug-storepass" >> "$GITHUB_ENV"
          echo "LYRICO_KEY_ALIAS=lyrico-debug" >> "$GITHUB_ENV"
          echo "LYRICO_KEY_PASSWORD=lyrico-debug-storepass" >> "$GITHUB_ENV"
          echo "✅ 已解码固定 keystore"

      # ── 9. 构建 Debug APK ────────────────────────────────────────────────────
      # --stacktrace 出错时打印完整调用栈，方便定位问题
      - name: 🛠️ 构建 Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ── 10. 上传 v7 APK（手表主产物，必须成功）────────────────────────────────
      - name: 📤 上传 v7 APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: Lyrico-Wear-armeabi-v7a
          path: lyrico-app/build/outputs/apk/debug/*armeabi-v7a*.apk
          retention-days: 30
          if-no-files-found: error

      # ── 11. 上传 v8 APK（64 位设备用，可选）──────────────────────────────────
      - name: 📤 上传 v8 APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: Lyrico-Wear-arm64-v8a
          path: lyrico-app/build/outputs/apk/debug/*arm64-v8a*.apk
          retention-days: 30
          if-no-files-found: warn

# ============================================================================
# 【构建失败排查】
#
# 1. 子模块缺失（taglib / quickjs-ng）：
#    → 确认 .gitmodules 配置正确
#    → 本地开发用 git submodule update --init --recursive
#
# 2. NDK / CMake 错误：
#    → 检查 lyrico-app/build.gradle.kts 中的 ndkVersion 和 cmake version
#    → 确认 setup-ndk 的 ndk-version 与之匹配
#
# 3. Shizuku 依赖找不到：
#    → 确认 jitpack 仓库在 settings.gradle.kts 中配置正确
#
# 4. Wear Compose API 找不到：
#    → 检查 libs.versions.toml 中的 wearCompose 版本
#    → 确认 lyrico-app/build.gradle.kts 引用了正确的依赖
#
# 5. Gradle 编译错误：
#    → 看 --stacktrace 输出定位具体文件
#    → 常见原因：上游代码有 breaking change
#
# 6. 覆盖安装提示"签名冲突"：
#    → 未配置固定 keystore secret
#    → 去 fork 仓库 Settings → Secrets → Actions → New secret
#    → Name: LYRICO_KEYSTORE_BASE64
# ============================================================================
